name: Deploy accuracy report to Pages

# Publishes reports/accuracy_report.html as the Pages site's index.html.
#
# - `push` covers a report commit pushed with user credentials (e.g. a manual
#   local regeneration). GitHub does not fire `push` for commits made with the
#   default GITHUB_TOKEN, to prevent workflow-triggers-workflow loops, so it
#   misses regenerate-report.yml's automated commit.
# - `workflow_run` covers that case: it fires when regenerate-report.yml
#   completes, and the job runs only if that run succeeded.
# - `workflow_dispatch` redeploys on demand.
on:
  push:
    branches: [main]
    paths:
      - reports/accuracy_report.html
  workflow_run:
    workflows: ["Regenerate accuracy report"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `main` by name, not `github.event.workflow_run.head_sha`: the
          # triggering run's head_sha is the commit it started from, not the
          # report commit it pushed, so it would deploy a stale report.
          ref: main

      - name: Prepare Pages site
        run: |
          mkdir -p site
          cp reports/accuracy_report.html site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
