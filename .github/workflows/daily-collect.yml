name: Daily forecast collection

on:
  schedule:
    # 08:00 UTC ~= 18:00 Melbourne (AEST) / 19:00 (AEDT) - an evening collection run.
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-weather-collection
  # true (not false): each day's run is independent and self-contained, so if
  # a manual workflow_dispatch run and the scheduled run ever overlap, the
  # older one should yield to the newer rather than blocking it - there's
  # nothing in a half-finished run worth preserving. Note: this is not what
  # caused the report to stop updating on 2026-07-22/23 - re-checking the
  # Actions history afterwards showed the scheduled runs WERE firing every
  # day and were never blocked; each one simply ran past this job's
  # timeout-minutes and got killed mid-job. See that field's comment.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A real incident: this was 45 for months, but by 2026-07 the full 30-
    # location pipeline had grown to take ~39 minutes on a good day - close
    # enough to the ceiling that the next two days' runs got killed mid-job
    # by this timeout (not blocked by a stuck previous run - that's a
    # different problem, see the concurrency comment below). One was cut off
    # mid-collect, the other mid-report-generation, and either way nothing
    # got committed, so the report silently stopped updating. 120 gives
    # genuine headroom instead of sitting right at the edge.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip
      - run: pip install -e .

      - name: Collect, record actual, blend baseline, retrain, and predict for every location
        # Small-slice sub-daily rain periods (--collect-periods onward) were
        # previously never run by this workflow at all - the whole feature's
        # data only ever got refreshed by hand, and would have silently gone
        # stale the day after whichever manual run last touched it. Kept as
        # explicit flags alongside --all rather than folded into it, same
        # reasoning as cli.py's flag layout: nothing about the existing daily
        # pipeline changes, this is purely additive. No --backtest-periods-
        # days here, matching --backtest-days's absence above - backtesting
        # reconstructs history that was never live-predicted; a normal daily
        # run always produces today's live prediction directly and never
        # needs that catch-up path.
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_KEY }}
          WEATHERBIT_KEY: ${{ secrets.WEATHERBIT_KEY }}
          ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          weather-ensemble \
            --all-locations \
            --all --window 30 --train --train-window 90 --predict-ml --predict-best --narrate-best \
            --collect-periods --record-actual-periods --forecast-periods \
            --train-periods --predict-ml-periods \
            --archive-forecasts-days 180

      - name: Commit and push the updated database
        # A real incident: `git pull --rebase` here failed outright, over and
        # over (most of the pipeline's first two weeks), whenever ANYTHING
        # else pushed to main while this job's ~40 minutes of collection was
        # running - another workflow_dispatch run, or any manual push from
        # local dev work. data/weather.db is a single opaque SQLite binary;
        # git cannot diff or merge two independently-changed copies of it, so
        # a rebase conflict on it is unresolvable, and the WHOLE step (and
        # the whole day's freshly-collected data) was lost every time this
        # happened. Fixed by never rebasing at all: each retry re-syncs the
        # branch to whatever is currently on origin (so nothing else's
        # changes are ever discarded) and then re-applies only this run's own
        # data/weather.db on top before committing - so a race can, at worst,
        # cost this job's own DB update one more fetch-and-retry, never a
        # dropped commit. data/weather_periods.db (sub-daily rain) is a
        # second, separate SQLite file - see get_periods_db_path - carried
        # through the same re-sync-then-reapply dance alongside it.
        # data/archive/ (Parquet, see archive.py) gets the same treatment -
        # --archive-forecasts-days above only ever appends to or trims these
        # files, so re-applying this run's copy on top of latest origin can't
        # lose anything either.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/weather.db /tmp/collected_weather.db
          cp data/weather_periods.db /tmp/collected_weather_periods.db
          mkdir -p data/archive /tmp/collected_archive
          cp -r data/archive/. /tmp/collected_archive/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/collected_weather.db data/weather.db
            cp /tmp/collected_weather_periods.db data/weather_periods.db
            mkdir -p data/archive
            cp -r /tmp/collected_archive/. data/archive/
            git add data/weather.db data/weather_periods.db data/archive
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Daily forecast collection $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - retrying against latest main"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push data/weather.db after 5 attempts"
          exit 1

      # Report regeneration lives in its own workflow (regenerate-report.yml),
      # triggered by this workflow completing - a shorter, separately
      # retriggerable step means a failure/race there can never also cost
      # this run's actual data collection, and it can be re-run on demand
      # without redoing the whole 30-location collection.
