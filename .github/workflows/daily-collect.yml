name: Daily forecast collection

on:
  schedule:
    # 08:17 UTC = 18:17 AEST / 19:17 AEDT (Melbourne): an evening collection run.
    # Scheduled off the top of the hour, which is GitHub's most congested cron
    # slot and the most common cause of delayed or dropped scheduled runs.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-weather-collection
  # Each run is self-contained, so if a manual workflow_dispatch run and the
  # scheduled run overlap, the older one is cancelled in favour of the newer.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # A run killed by the timeout commits nothing, so this sits well above a
    # full 30-location run's normal duration.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip
      - run: pip install -e .

      - name: Collect, record actual, blend baseline, retrain, and predict for every location
        # --all: catch up any recently missed dates, collect every source,
        # record actuals and build the Weighted blend. Then retrain and predict
        # ML, pick Best and write narratives, and run the same steps for
        # sub-daily rain periods (separate opt-in flags, not part of --all).
        # --archive-forecasts-days moves raw forecast rows older than 180 days
        # to Parquet under data/archive/. No --backtest-* flags: a daily run
        # predicts live, and catch-up already reconstructs any missed dates.
        env:
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          VISUAL_CROSSING_KEY: ${{ secrets.VISUAL_CROSSING_KEY }}
          OPENWEATHERMAP_KEY: ${{ secrets.OPENWEATHERMAP_KEY }}
          WEATHERBIT_KEY: ${{ secrets.WEATHERBIT_KEY }}
          ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          weather-ensemble \
            --all-locations \
            --all --window 30 --train --train-window 90 --predict-ml --predict-best --narrate-best \
            --collect-periods --record-actual-periods --forecast-periods \
            --train-periods --predict-ml-periods \
            --archive-forecasts-days 180

      - name: Commit and push the updated database
        # Never rebases: git can't merge two changed copies of a SQLite file,
        # so a rebase conflict on one is unresolvable. Instead each attempt
        # resets to the latest origin/main, copies this run's data/weather.db,
        # data/weather_periods.db and data/archive/ (Parquet) back on top, and
        # commits. Other files pushed to main meanwhile are kept (this run's
        # copies of the data files win), and a push race costs a retry (up to
        # 5, with a growing delay) rather than the day's data.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/weather.db /tmp/collected_weather.db
          cp data/weather_periods.db /tmp/collected_weather_periods.db
          mkdir -p data/archive /tmp/collected_archive
          cp -r data/archive/. /tmp/collected_archive/

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/collected_weather.db data/weather.db
            cp /tmp/collected_weather_periods.db data/weather_periods.db
            mkdir -p data/archive
            cp -r /tmp/collected_archive/. data/archive/
            git add data/weather.db data/weather_periods.db data/archive
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Daily forecast collection $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - retrying against latest main"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push data/weather.db after 5 attempts"
          exit 1

      # The report is rebuilt by regenerate-report.yml, which runs when this
      # workflow completes successfully. Keeping it separate means a report
      # failure can't cost the collected data, and the report can be rebuilt
      # on demand without re-collecting.
