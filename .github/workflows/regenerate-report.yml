name: Regenerate accuracy report

# Rebuilds reports/accuracy_report.html from the databases. Separate from
# daily-collect.yml so a failure here can't cost that run's collected data,
# and so the report can be rebuilt without re-collecting.
#
# - `workflow_run` covers the nightly case: it fires when daily-collect.yml
#   completes, and the job runs only if that run succeeded.
# - `push` on data/weather.db or data/weather_periods.db covers a manual push
#   that changes the data outside the nightly run (a backfill, dedupe,
#   retrain or reconcile). Commits made with the default GITHUB_TOKEN, like
#   daily-collect.yml's, don't fire `push`.
# - `workflow_dispatch` rebuilds on demand with no data change (e.g. after a
#   report-rendering code change).
on:
  workflow_run:
    workflows: ["Daily forecast collection"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - data/weather.db
      - data/weather_periods.db
  workflow_dispatch:

concurrency:
  group: regenerate-report
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # `main` by name, not `github.event.workflow_run.head_sha`: the
          # triggering run's head_sha is the commit it started from, not the
          # data commit it pushed, so it would rebuild from stale data.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -U pip
      - run: pip install -e .

      - name: Regenerate accuracy report across all locations
        run: |
          weather-ensemble \
            --all-locations \
            --accuracy-report reports/accuracy_report.html

      - name: Commit and push the regenerated report
        # Same non-rebasing retry pattern as daily-collect.yml's commit step
        # (see its comment). Commits the report and
        # data/weather_report_archive.db, which holds a rolling 30 days of
        # gzip-compressed report snapshots (see report_archive.py); the
        # snapshot for this run is added by --accuracy-report above.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp reports/accuracy_report.html /tmp/accuracy_report.html
          cp data/weather_report_archive.db /tmp/weather_report_archive.db

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/accuracy_report.html reports/accuracy_report.html
            cp /tmp/weather_report_archive.db data/weather_report_archive.db
            git add reports/accuracy_report.html data/weather_report_archive.db
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "Regenerate accuracy report $(date -u +%Y-%m-%dT%H:%M)"
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - retrying against latest main"
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push accuracy_report.html after 5 attempts"
          exit 1

      # deploy-pages.yml publishes the report when this workflow completes
      # successfully.
